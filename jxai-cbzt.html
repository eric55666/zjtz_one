<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>财报小侦探 | 上市公司财务分析学习</title>
    <style>
        /* 基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial Rounded MT Bold', 'Arial', sans-serif;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        /* 游戏容器 */
        .game-container {
            width: 100%;
            max-width: 1000px;
            background-color: white;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            border: 8px solid white;
        }
        
        /* 标题区域 */
        .header {
            background: linear-gradient(to right, #6a89cc, #4a69bd);
            color: white;
            padding: 25px;
            text-align: center;
            position: relative;
            border-bottom: 5px solid #4a69bd;
        }
        
        .header h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.2);
            letter-spacing: 1px;
        }
        
        .header p {
            font-size: 1.3rem;
            opacity: 0.9;
        }
        
        /* 进度条 */
        .progress-container {
            padding: 15px 25px;
            background-color: #f9f9f9;
            border-bottom: 3px solid #e0e0e0;
        }
        
        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        
        .progress-bar {
            height: 12px;
            background-color: #e0e0e0;
            border-radius: 6px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            width: 0%;
            border-radius: 6px;
            transition: width 0.5s;
        }
        
        /* 聊天区域 */
        .chat-area {
            height: 450px;
            padding: 20px;
            overflow-y: auto;
            background-color: #f9f9f9;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.8) 2px, transparent 2px),
                radial-gradient(circle at 90% 80%, rgba(255, 255, 255, 0.8) 2px, transparent 2px);
            background-size: 30px 30px;
        }
        
        /* 消息样式 - 头像和气泡结合 */
        .message {
            display: flex;
            margin-bottom: 25px;
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message-ai {
            justify-content: flex-start;
        }
        
        .message-user {
            justify-content: flex-end;
        }
        
        /* 动漫风格头像 */
        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin: 0 15px;
            border: 5px solid white;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
            position: relative;
            overflow: hidden;
            z-index: 10;
        }
        
        .ai-avatar {
            background: linear-gradient(135deg, #6a89cc, #4a69bd);
            border-color: #6a89cc;
        }
        
        .user-avatar {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            border-color: #ff9a9e;
        }
        
        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .avatar-placeholder {
            font-size: 2.5rem;
            line-height: 1;
        }
        
        /* 聊天气泡 */
        .message-bubble {
            max-width: 65%;
            padding: 20px;
            border-radius: 25px;
            position: relative;
            font-size: 1.05rem;
            line-height: 1.6;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }
        
        .ai-bubble {
            background-color: white;
            color: #333;
            border-left: 8px solid #6a89cc;
            border-top-left-radius: 5px;
        }
        
        .ai-bubble::before {
            content: "";
            position: absolute;
            left: -20px;
            top: 25px;
            width: 0;
            height: 0;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            border-right: 20px solid white;
            z-index: 1;
        }
        
        .user-bubble {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            color: white;
            border-right: 8px solid #ff7e5f;
            border-top-right-radius: 5px;
        }
        
        .user-bubble::before {
            content: "";
            position: absolute;
            right: -20px;
            top: 25px;
            width: 0;
            height: 0;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            border-left: 20px solid #ff9a9e;
            z-index: 1;
        }
        
        /* 消息内容 */
        .message-content {
            flex: 1;
        }
        
        .message-sender {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
        }
        
        .ai-sender {
            color: #4a69bd;
        }
        
        .user-sender {
            color: #ff6b6b;
        }
        
        /* 选项区域 */
        .options-area {
            padding: 25px;
            background-color: white;
            border-top: 3px solid #f0f0f0;
        }
        
        .options-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #555;
            font-weight: bold;
            display: flex;
            align-items: center;
        }
        
        .options-title::before {
            content: "💡";
            margin-right: 12px;
            font-size: 1.8rem;
        }
        
        .options-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .option-btn {
            padding: 18px;
            background-color: #f0f8ff;
            border: 3px solid #d1e7ff;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            text-align: center;
            font-size: 1.05rem;
            position: relative;
            overflow: hidden;
        }
        
        .option-btn:hover {
            background-color: #e1f0ff;
            border-color: #6a89cc;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(106, 137, 204, 0.15);
        }
        
        .option-btn::after {
            content: "✨";
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .option-btn:hover::after {
            opacity: 1;
        }
        
        /* 输入区域 */
        .input-area {
            display: flex;
            gap: 15px;
        }
        
        .input-area input {
            flex: 1;
            padding: 18px 20px;
            border: 3px solid #d1e7ff;
            border-radius: 20px;
            font-size: 1.05rem;
            font-family: inherit;
            transition: all 0.3s;
            background-color: #f9fdff;
        }
        
        .input-area input:focus {
            outline: none;
            border-color: #6a89cc;
            background-color: white;
            box-shadow: 0 5px 15px rgba(106, 137, 204, 0.1);
        }
        
        .send-btn {
            background: linear-gradient(135deg, #6a89cc, #4a69bd);
            color: white;
            border: none;
            border-radius: 20px;
            width: 65px;
            cursor: pointer;
            font-size: 1.8rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 15px rgba(106, 137, 204, 0.3);
        }
        
        .send-btn:hover {
            background: linear-gradient(135deg, #5a79bc, #3a59ad);
            transform: translateY(-3px);
            box-shadow: 0 12px 20px rgba(106, 137, 204, 0.4);
        }
        
        /* 特殊样式 */
        .highlight {
            background-color: #fff9c4;
            padding: 2px 6px;
            border-radius: 5px;
            font-weight: bold;
            color: #333;
            border: 2px dashed #ffb74d;
        }
        
        .website-link {
            display: inline-block;
            background-color: #e3f2fd;
            border: 3px solid #bbdefb;
            border-radius: 15px;
            padding: 10px 15px;
            margin: 8px 0;
            color: #1565c0;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .website-link:hover {
            background-color: #bbdefb;
            transform: translateX(5px);
        }
        
        .emoji {
            font-size: 1.2rem;
            margin: 0 3px;
        }
        
        /* 模拟框 */
        .simulation-box {
            background-color: #f0f8ff;
            border: 3px solid #6a89cc;
            border-radius: 15px;
            padding: 18px;
            margin: 15px 0;
        }
        
        .simulation-title {
            font-weight: bold;
            color: #4a69bd;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            font-size: 1.1rem;
        }
        
        .simulation-title::before {
            content: "🖥️";
            margin-right: 10px;
            font-size: 1.5rem;
        }
        
        /* 完成界面 */
        .completion-screen {
            text-align: center;
            padding: 40px 30px;
            background: linear-gradient(135deg, #f0f8ff, #fff0f8);
            display: none;
        }
        
        .trophy {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        .completion-title {
            font-size: 2.8rem;
            color: #4a69bd;
            margin-bottom: 15px;
        }
        
        .completion-text {
            font-size: 1.3rem;
            color: #555;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        
        .restart-btn {
            padding: 18px 35px;
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 20px;
            transition: all 0.3s;
            font-family: inherit;
            box-shadow: 0 10px 20px rgba(255, 126, 95, 0.3);
        }
        
        .restart-btn:hover {
            background: linear-gradient(135deg, #ff6b4a, #fea46b);
            transform: translateY(-5px);
            box-shadow: 0 15px 25px rgba(255, 126, 95, 0.4);
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.2rem;
            }
            
            .chat-area {
                height: 400px;
                padding: 15px;
            }
            
            .avatar {
                width: 60px;
                height: 60px;
                margin: 0 10px;
            }
            
            .avatar-placeholder {
                font-size: 2rem;
            }
            
            .message-bubble {
                max-width: 75%;
                padding: 15px;
            }
            
            .options-container {
                grid-template-columns: 1fr;
            }
            
            .completion-title {
                font-size: 2.2rem;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .game-container {
                border-radius: 15px;
            }
            
            .header {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
            
            .chat-area {
                height: 350px;
            }
            
            .avatar {
                width: 50px;
                height: 50px;
            }
            
            .avatar-placeholder {
                font-size: 1.5rem;
            }
            
            .message-bubble {
                font-size: 1rem;
            }
        }
    </style>
</head>

            ]
        };
        
        // DOM元素
        const chatArea = document.getElementById('chat-area');
        const optionsContainer = document.getElementById('options-container');
        const optionsTitle = document.getElementById('options-title');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const inputArea = document.getElementById('input-area');
        const progressFill = document.getElementById('progress-fill');
        const progressPercent = document.getElementById('progress-percent');
        const completionScreen = document.getElementById('completion-screen');
        const restartBtn = document.getElementById('restart-btn');
        const optionsArea = document.getElementById('options-area');
        
        // 创建动漫风格头像
        function createAvatar(sender) {
            const avatar = document.createElement('div');
            avatar.className = `avatar ${sender}-avatar`;
            
            // 为AI助手和用户创建不同的动漫风格头像
            if (sender === 'ai') {
                // AI助手头像 - 老师形象
                avatar.innerHTML = `
                    <div class="avatar-placeholder">👩🏫</div>
                `;
            } else {
                // 用户头像 - 学生形象
                avatar.innerHTML = `
                    <div class="avatar-placeholder">${gameData.userAvatar}</div>
                `;
            }
            
            return avatar;
        }
        
        // 初始化游戏
        function initGame() {
            // 重置游戏状态
            gameData.currentStep = 0;
            gameData.progress = 0;
            gameData.userName = "小侦探";
            gameData.userAvatar = "👨🎓";
            
            // 清空聊天记录
            chatArea.innerHTML = '';
            optionsContainer.innerHTML = '';
            
            // 显示聊天区域，隐藏完成界面
            optionsArea.style.display = 'block';
            completionScreen.style.display = 'none';
            
            // 更新进度条
            updateProgress();
            
            // 显示第一步消息
            displayStep();
        }
        
        // 更新进度条
        function updateProgress() {
            gameData.progress = (gameData.currentStep / gameData.totalSteps) * 100;
            progressFill.style.width = `${gameData.progress}%`;
            progressPercent.textContent = `${Math.round(gameData.progress)}%`;
        }
        
        // 显示当前步骤
        function displayStep() {
            const step = gameData.steps[gameData.currentStep];
            
            // 替换消息中的变量
            let aiMessage = step.aiMessage.replace(/\${userName}/g, gameData.userName);
            
            // 添加AI消息
            addMessage(aiMessage, 'ai', '小财老师');
            
            // 如果是最后一步，显示完成界面
            if (gameData.currentStep === gameData.totalSteps - 1) {
                setTimeout(() => {
                    completeGame();
                }, 1500);
                return;
            }
            
            // 渲染用户选项
            renderOptions(step);
            
            // 更新输入框提示
            if (step.inputPrompt) {
                userInput.placeholder = step.inputPlaceholder || "请输入...";
                userInput.style.display = 'block';
                userInput.focus();
            } else {
                userInput.style.display = 'none';
            }
        }
        
        // 添加消息到聊天窗口
        function addMessage(message, sender, senderName) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message message-${sender}`;
            
            // 创建头像
            const avatar = createAvatar(sender);
            
            // 创建气泡
            const messageBubble = document.createElement('div');
            messageBubble.className = `message-bubble ${sender}-bubble`;
            
            // 创建发送者名称
            const senderDiv = document.createElement('div');
            senderDiv.className = `message-sender ${sender}-sender`;
            senderDiv.textContent = senderName || (sender === 'ai' ? '小财老师' : gameData.userName);
            
            // 创建消息内容
            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            messageContent.innerHTML = message;
            
            // 组装气泡
            messageBubble.appendChild(senderDiv);
            messageBubble.appendChild(messageContent);
            
            // 根据发送者组装消息
            if (sender === 'ai') {
                messageDiv.appendChild(avatar);
                messageDiv.appendChild(messageBubble);
            } else {
                messageDiv.appendChild(messageBubble);
                messageDiv.appendChild(avatar);
            }
            
            chatArea.appendChild(messageDiv);
            
            // 滚动到底部
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        // 渲染选项
        function renderOptions(step) {
            optionsContainer.innerHTML = '';
            
            // 如果是测验步骤
            if (step.quiz) {
                optionsTitle.innerHTML = "💡 " + step.quiz.question;
                const quizOptions = step.quiz.options;
                quizOptions.forEach((option, index) => {
                    const optionBtn = document.createElement('div');
                    optionBtn.className = 'option-btn';
                    optionBtn.textContent = option;
                    optionBtn.addEventListener('click', () => handleQuizAnswer(index, step.quiz.correctAnswer, step.quiz.explanation));
                    optionsContainer.appendChild(optionBtn);
                });
                return;
            }
            
            // 普通选项步骤
            if (step.userOptions && step.userOptions.length > 0) {
                optionsTitle.innerHTML = "💡 请选择你的回答：";
                step.userOptions.forEach((option, index) => {
                    const optionBtn = document.createElement('div');
                    optionBtn.className = 'option-btn';
                    optionBtn.textContent = option;
                    optionBtn.addEventListener('click', () => handleOptionClick(option, index, step.correctOption, step.explanation));
                    optionsContainer.appendChild(optionBtn);
                });
            } else {
                // 没有选项，直接显示输入框
                optionsTitle.innerHTML = "💡 请输入你的回答：";
            }
        }
        
        // 处理选项点击
        function handleOptionClick(option, index, correctIndex, explanation) {
            // 添加用户消息
            addMessage(option, 'user', gameData.userName);
            
            // 禁用所有选项
            const optionButtons = document.querySelectorAll('.option-btn');
            optionButtons.forEach(btn => {
                btn.style.pointerEvents = 'none';
            });
            
            // 检查答案（如果有正确答案）
            if (correctIndex !== undefined) {
                // 检查是否正确
                const isCorrect = index === correctIndex;
                
                // 显示答案解释
                setTimeout(() => {
                    addMessage(explanation, 'ai', '小财老师');
                    
                    // 下一步
                    setTimeout(() => {
                        nextStep();
                    }, 2000);
                }, 800);
            } else {
                // 没有正确答案，直接下一步
                setTimeout(() => {
                    nextStep();
                }, 800);
            }
        }
        
        // 处理测验答案
        function handleQuizAnswer(selectedIndex, correctIndex, explanation) {
            const options = document.querySelectorAll('.option-btn');
            
            // 显示正确答案和错误答案
            options.forEach((option, index) => {
                if (index === correctIndex) {
                    option.style.backgroundColor = '#d4edda';
                    option.style.borderColor = '#28a745';
                } else if (index === selectedIndex && index !== correctIndex) {
                    option.style.backgroundColor = '#f8d7da';
                    option.style.borderColor = '#dc3545';
                }
                
                // 禁用点击
                option.style.pointerEvents = 'none';
            });
            
            // 添加解释
            setTimeout(() => {
                addMessage(explanation, 'ai', '小财老师');
                
                // 下一步
                setTimeout(() => {
                    nextStep();
                }, 2000);
            }, 1000);
        }
        
        // 下一步
        function nextStep() {
            if (gameData.currentStep < gameData.totalSteps - 1) {
                gameData.currentStep++;
                updateProgress();
                setTimeout(() => {
                    displayStep();
                }, 500);
            } else {
                completeGame();
            }
        }
        
        // 完成游戏
        function completeGame() {
            // 显示完成界面
            optionsArea.style.display = 'none';
            completionScreen.style.display = 'block';
            
            // 添加最终消息
            addMessage("我已经完成了学习，准备开始真正的财务分析了！", 'user', gameData.userName);
        }
        
        // 处理用户输入
        function handleUserInput() {
            const input = userInput.value.trim();
            if (!input) return;
            
            // 第一步是询问姓名
            if (gameData.currentStep === 0) {
                gameData.userName = input || "小侦探";
                gameData.userAvatar = "👨🎓";
                
                addMessage(input, 'user', gameData.userName);
                setTimeout(() => {
                    nextStep();
                }, 800);
            }
            
            // 清空输入框
            userInput.value = '';
        }
        
        // 事件监听器
        sendBtn.addEventListener('click', handleUserInput);
        
        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleUserInput();
            }
        });
        
        restartBtn.addEventListener('click', initGame);
        
        // 初始化游戏
        initGame();
    </script>
</body>
</html>
